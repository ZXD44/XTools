name: Release XTools

on:
  push:
    branches:
      - main
    paths:
      - 'bin/**'
      - 'scripts/**'
      - 'assets/**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Build Commit Hash
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          sed -i "s/^BUILD = .*/BUILD = \"${SHORT_SHA}\"/" scripts/config/constants.py
          echo "sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "tag=v0.0.1-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Package xtools.zip
        run: |
          mkdir -p dist_pkg
          for dir in bin scripts assets; do
            if [ -d "$dir" ]; then
              cp -r "$dir" dist_pkg/
            fi
          done
          cd dist_pkg
          zip -r ../xtools.zip .
          cd ..
          sha256sum xtools.zip > xtools.zip.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            xtools.zip
            xtools.zip.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
